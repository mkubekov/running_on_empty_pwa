name = "pochti-na-nule"
main = "worker/index.ts"
compatibility_date = "2025-05-01"

# Статика PWA и API живут в одном воркере: один деплой, один домен,
# и крон-триггер доступен (в Cloudflare Pages Functions его нет).
[assets]
directory = "./dist"
binding = "ASSETS"
# SPA-роутинг: /log, /skills/say-no и т. д. отдают index.html.
not_found_handling = "single-page-application"
# Все запросы идут через воркер: иначе статика отдаётся в обход него, и
# проверка пароля для страниц просто не выполняется — закрытым остаётся
# только API, а бандл со словарём забирают напрямую.
run_worker_first = true

# Три напоминания в день + запас на сбои. Шаг 15 минут — компромисс между
# точностью и числом вызовов на бесплатном тарифе.
[triggers]
crons = ["*/15 * * * *"]

# VAPID_SUBJECT лежит в секретах, а не здесь: это личный адрес владельца ключа,
# и в публичном репозитории ему не место. Спецификация VAPID требует контакт,
# по которому push-сервисы напишут, если с ключа пойдёт спам; письма туда
# не приходят и оттуда не уходят.
#   npx wrangler secret put VAPID_SUBJECT

[[kv_namespaces]]
binding = "SUBS"
id = "2cd52c3ff86c4677b5bd85f77c59d509"
